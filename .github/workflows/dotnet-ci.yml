name: .NET 9 CI - restore / build / test

on: [push, pull_request]

jobs:
  restore:
    name: Restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore packages
        run: dotnet restore

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: restore
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

  test:
    name: Test (run tests + coverage)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Run tests (TRX + coverage)
        run: |
          dotnet test --configuration Release \
            --logger "trx;LogFileName=TestResults.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
      - name: Install ReportGenerator and generate HTML coverage
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.1.23
          $HOME/.dotnet/tools/reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:Html
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report